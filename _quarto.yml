project:
  type: book
  output-dir: build

profile:
  default: de

book:
  title: "English title of the thesis"
  subtitle: "English subtitle"
  output-file: abschlussarbeit
  author: "Vorname Nachname"

bibliography: content/references.bib
csl: internal/csl/ieee.csl

filters:
  - internal/scripts/thesis-setup.lua

# Sprache und Abschlussart werden zentral in setup.tex ausgewählt.
title-de: "Deutscher Titel der Abschlussarbeit"
subtitle-de: "Deutscher Untertitel"
study-program: "Name des Studiengangs"
institution: "Hochschule Campus Wien"
submission-year: "2026"
supervisors:
  - "Titel Vorname Nachname"
  - "Titel Vorname Nachname (optional)"

format:
  hcw-pdf:
    # Wie in Word: Abbildungen/Tabellen durchgehend; Listings je Kapitel.
    crossref:
      chapters: false
    documentclass: scrreprt
    fontsize: 12pt
    number-sections: true
    toc: false
    lof: false
    lot: false
    colorlinks: false
    keep-tex: false
    tbl-pos: H
    tbl-cap-location: bottom
    template-partials:
      - internal/latex/title.tex
    include-in-header:
      - setup.tex
      - internal/latex/preamble.tex
